# Publica la página en GitHub Pages cada vez que se sube algo a main.
# En GitHub: Settings > Pages > Source = "GitHub Actions" (no "Deploy from a branch").
# Guía oficial: https://docs.astro.build/en/guides/deploy/github/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, la anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v7
      - name: Instalar, construir y subir la página
        uses: withastro/action@v6
        env:
          SITIO_URL: https://cartica07.github.io
          SITIO_BASE: /tvretro-web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v5
