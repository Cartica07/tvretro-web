# =====================================================================
#  Pepito · Contenido de la página web
# ---------------------------------------------------------------------
#  Aquí cambias textos, precios, contacto y enlaces SIN tocar el código.
#
#  Tono: vender, no explicar. Frases cortas y con ganas; nada de cifras
#  técnicas (pulgadas, cantidades exactas) salvo en la tabla de diferencias.
#
#  Reglas sencillas:
#   1. No borres ni cambies los nombres que van antes de los dos puntos (:).
#   2. Los textos van entre comillas "así".
#   3. Lo que empiece con [PENDIENTE: ...] sale marcado en amarillo en la
#      página hasta que lo reemplaces por el dato real.
#   4. Si algo queda mal escrito, al construir la página te sale un aviso
#      diciendo qué campo revisar. Nada se publica roto.
#   5. Para ver todo lo que falta:  npm run pendientes
# =====================================================================

marca:
  nombre: "Pepito"
  # Nombre legal o marca con la que vendes (sale en el pie de página).
  negocio: "[PENDIENTE: nombre legal o marca del negocio]"
  # Dirección definitiva de la página (cuando tengas dominio). Ej: "https://pepito.co"
  dominio: "[PENDIENTE: dominio de la página]"

# Lo que muestra Google y la vista previa al compartir el enlace por WhatsApp.
seo:
  titulo: "Pepito · El televisorcito retro que canta, escribe y enamora"
  descripcion: "Pepito es una mini TV retro de píxeles con sonido que manejas desde tu celular: canciones con letra, mensajes, fotos, GIF y alarmas. El regalo más original."

contacto:
  # Solo números, con el 57 de Colombia adelante. Ej: "573001234567"
  whatsapp: "[PENDIENTE: número de WhatsApp]"
  # Mensaje que ya aparece escrito cuando el cliente abre WhatsApp.
  mensajeWhatsApp: "¡Hola! Quiero información de Pepito 📺"
  correo: "[PENDIENTE: correo de contacto]"
  # Usuarios sin la @. Si una red no la usas, déjala vacía: "".
  instagram: "[PENDIENTE: usuario de Instagram]"
  tiktok: "cartadroid"
  facebook: "[PENDIENTE: usuario o página de Facebook]"

# Tu comunidad de TikTok (sale debajo de los botones de la portada).
tiktok:
  # Escríbelo como quieres que se lea. Déjalo vacío ("") para ocultar la frase.
  seguidores: "20 mil"

# La pantallita de la portada (se dibuja con el mismo código de la app,
# letra Sans tamaño 2, como sale por defecto). El tercer mensaje pasa
# deslizándose (Scroll). Caben letras, números, tildes, ñ, ¿ y ¡.
pantalla:
  mensajes:
    - "¡Hola, Ana!"
    - "Te quiero mucho"
    - "¡Feliz cumple!"
    - "¿Café a las 3?"

portada:
  # La palabra entre *asteriscos* sale resaltada con brillo.
  titulo: "Pepito, el televisorcito que *canta*, escribe y enamora."
  subtitulo: "Ponle canciones, mensajes, fotos y GIF desde tu celular. Un regalo que suena, brilla y saca sonrisas."
  botonPrincipal: "Pedir por WhatsApp"
  botonSecundario: "Ver versiones"
  botonSonido: "Escucha cómo suena"
  # Datos cortos que salen en una línea debajo del subtítulo.
  destacados:
    - "Decenas de canciones incluidas"
    - "Lo manejas desde tu celular"
    - "Te despierta con tu canción"

# Sección "Todo lo que le puedes mandar a Pepito". Puedes cambiar textos y el
# orden, pero no el "id" (es el que decide qué animación sale en la pantallita).
muestra:
  titulo: "Todo lo que le puedes mandar a Pepito"
  subtitulo: "Toca cada opción y mira la pantallita en acción."
  tipos:
    - id: "mensajes"
      nombre: "Mensajes"
      titulo: "Dile algo bonito, cuando quieras"
      texto: "Un buenos días, un te quiero o un «ya voy en camino». Lo escribes en tu celular y aparece en su pantalla."
      puntos:
        - "Con la letra que más te guste"
        - "Grande, pequeño o en movimiento"
        - "Llega en segundos"
    - id: "canciones"
      nombre: "Canciones"
      titulo: "Canciones que suenan y se ven"
      texto: "Elige una y Pepito la canta, con la letra en pantalla y animaciones al ritmo de la música."
      puntos:
        - "Decenas de canciones incluidas"
        - "Con letra y animaciones"
        - "También como alarma"
    - id: "fotos"
      nombre: "Fotos"
      titulo: "Tus fotos, en versión retro"
      texto: "Escoge una foto y mírala convertida en arte de píxeles. O usa una de las muchas que ya trae."
      puntos:
        - "Directo desde tu celular"
        - "Galería incluida"
        - "Estilo retro de verdad"
    - id: "dibujos"
      nombre: "Dibujos"
      titulo: "Dibújale algo con el dedo"
      texto: "Hazle un dibujo con el dedo y mándaselo. Nadie más le va a dar un regalo así."
      puntos:
        - "Hecho por ti"
        - "Llega tal cual lo dibujaste"
        - "Guárdalos para después"
    - id: "gif"
      nombre: "GIF"
      titulo: "GIF y animaciones"
      texto: "Dale vida a su pantalla con tus GIF favoritos o con las animaciones que ya trae."
      puntos:
        - "Tus propios GIF"
        - "Animaciones incluidas"
        - "Se repiten solas"
    - id: "reloj"
      nombre: "Reloj"
      titulo: "Reloj y alarmas con tu canción"
      texto: "Pepito también te da la hora y te despierta con la canción que más te gusta."
      puntos:
        - "La hora siempre a la vista"
        - "Alarmas con tu canción"
        - "Brillo y volumen a tu gusto"

# Sección "Funciones". En cada una, version dice si es solo de una versión:
# "wifi" (Pepito Pro), "lite" (Pepito Lite) o "" (los dos).
# icono: compartir, juegos, galeria, actualizar, ajustes, bluetooth.
funciones:
  titulo: "Hecho para usarlo todos los días"
  subtitulo: "Lo que lo hace distinto a cualquier otro regalo."
  destacada:
    titulo: "Mándale algo aunque estés lejos"
    texto: "Lo que envías desde la app llega a su pantalla esté donde esté: en otra casa o en otra ciudad."
    version: "wifi"
    # Mensaje de la animación (cortito).
    mensaje: "¡Te extraño!"
  lista:
    - icono: "compartir"
      titulo: "Compártelo con tu gente"
      texto: "Tu familia, tu pareja o tus amigos también le pueden mandar cosas al mismo Pepito."
      version: "wifi"
    - icono: "juegos"
      titulo: "Juegos retro para pasar el rato"
      texto: "Varios juegos clásicos y divertidos que manejas con su rueda."
      version: "wifi"
    - icono: "galeria"
      titulo: "Galería lista para usar"
      texto: "Muchas imágenes y animaciones listas para enviar con un toque."
      version: ""
    - icono: "actualizar"
      titulo: "Siempre al día"
      texto: "Se actualiza solo y cada vez trae mejoras."
      version: "wifi"
    - icono: "ajustes"
      titulo: "A tu gusto"
      texto: "Brillo, volumen y hora, como a ti te guste, desde la app."
      version: ""
    - icono: "bluetooth"
      titulo: "Sin Wi-Fi, sin enredos"
      texto: "Se conecta directo a tu celular por Bluetooth. Lo emparejas una vez y a darle."
      version: "lite"

# Sección "Cómo funciona" (3 pasos de Pepito Pro). Las pantallitas son las que
# muestra el Pepito real.
pasos:
  titulo: "Cómo funciona"
  subtitulo: "Tres pasos, y solo la primera vez."
  lista:
    - titulo: "Conéctalo a tu Wi-Fi"
      texto: "Escanea con tu celular el código que aparece en su pantalla y escoge tu red."
    - titulo: "Vincúlalo a tu cuenta"
      texto: "Escribe en la app el código que te muestra. Así queda a tu nombre."
    - titulo: "Mándale lo que quieras"
      texto: "Un mensaje, una canción, una foto… y le llega en segundos."
  # Recuadro de la versión Lite, con la pantalla de emparejar copiada de su
  # firmware. Deja el título vacío ("") para ocultarlo.
  lite:
    titulo: "¿Tienes Pepito Lite? Es aún más fácil"
    texto: "Lo emparejas por Bluetooth con el PIN que aparece en su pantalla, y listo. Sin Wi-Fi ni cuenta."

# Videos de TikTok (se cargan solo cuando alguien les da play).
# Pega el enlace COMPLETO del video, el que sale al abrirlo en el navegador:
#   https://www.tiktok.com/@usuario/video/1234567890123456789
# Si quieres menos videos, borra el bloque completo (desde el guion).
videos:
  titulo: "Así suenan en TikTok"
  subtitulo: "Las mismas canciones que suenan en Pepito. Dale play."
  lista:
    - enlace: "[PENDIENTE: enlace del video 1]"
      titulo: "[PENDIENTE: nombre de la canción 1]"
    - enlace: "[PENDIENTE: enlace del video 2]"
      titulo: "[PENDIENTE: nombre de la canción 2]"
    - enlace: "[PENDIENTE: enlace del video 3]"
      titulo: "[PENDIENTE: nombre de la canción 3]"
    - enlace: "[PENDIENTE: enlace del video 4]"
      titulo: "[PENDIENTE: nombre de la canción 4]"

# Las dos versiones. estado: "disponible" o "proximamente".
versiones:
  - id: "wifi"
    nombre: "Pepito Pro"
    estado: "disponible"
    precio: "[PENDIENTE: precio de Pepito Pro]"
    mensajeWhatsApp: "¡Hola! Quiero un Pepito Pro 📺"
  - id: "lite"
    nombre: "Pepito Lite"
    estado: "proximamente"
    precio: "[PENDIENTE: precio de Pepito Lite]"
    mensajeWhatsApp: "¡Hola! Me interesa Pepito Lite 📺"

# Páginas legales (ya existen en la app; las de Pepito cubren Pro y Lite).
legal:
  privacidad: "https://cartica07.github.io/TV_RETRO/pepito/privacidad.html"
  terminos: "https://cartica07.github.io/TV_RETRO/pepito/terminos.html"
