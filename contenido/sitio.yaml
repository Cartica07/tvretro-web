# =====================================================================
#  TV RETRO · Contenido de la página web
# ---------------------------------------------------------------------
#  Aquí cambias textos, precios, contacto y enlaces SIN tocar el código.
#
#  Reglas sencillas:
#   1. No borres ni cambies los nombres que van antes de los dos puntos (:).
#   2. Los textos van entre comillas "así".
#   3. Lo que empiece con [PENDIENTE: ...] sale marcado en amarillo en la
#      página hasta que lo reemplaces por el dato real.
#   4. Si algo queda mal escrito, al construir la página te sale un aviso
#      diciendo qué campo revisar. Nada se publica roto.
#   5. Para ver todo lo que falta:  npm run pendientes
# =====================================================================

marca:
  nombre: "TV RETRO"
  # Nombre legal o marca con la que vendes (sale en el pie de página).
  negocio: "[PENDIENTE: nombre legal o marca del negocio]"
  # Dirección definitiva de la página (cuando tengas dominio). Ej: "https://tvretro.co"
  dominio: "[PENDIENTE: dominio de la página]"

# Lo que muestra Google y la vista previa al compartir el enlace por WhatsApp.
seo:
  titulo: "TV RETRO · La mini TV retro que canta, escribe y enamora"
  descripcion: "Una mini TV de píxeles con sonido que manejas desde tu celular: canciones con letra, mensajes, fotos, GIF y alarmas. El regalo más original."

contacto:
  # Solo números, con el 57 de Colombia adelante. Ej: "573001234567"
  whatsapp: "[PENDIENTE: número de WhatsApp]"
  # Mensaje que ya aparece escrito cuando el cliente abre WhatsApp.
  mensajeWhatsApp: "¡Hola! Quiero información de la TV RETRO 📺"
  correo: "[PENDIENTE: correo de contacto]"
  # Usuarios sin la @. Si una red no la usas, déjala vacía: "".
  instagram: "[PENDIENTE: usuario de Instagram]"
  tiktok: "cartadroid"
  facebook: "[PENDIENTE: usuario o página de Facebook]"

# Tu comunidad de TikTok (sale debajo de los botones de la portada).
tiktok:
  # Escríbelo como quieres que se lea. Déjalo vacío ("") para ocultar la frase.
  seguidores: "20 mil"

# La pantallita de la portada (se dibuja con el mismo código de la app,
# letra Sans tamaño 2, como sale por defecto). El tercer mensaje pasa
# deslizándose (Scroll). Caben letras, números, tildes, ñ, ¿ y ¡.
pantalla:
  mensajes:
    - "¡Hola, Ana!"
    - "Te quiero mucho"
    - "¡Feliz cumple!"
    - "¿Café a las 3?"

portada:
  # La palabra entre *asteriscos* sale resaltada con brillo.
  titulo: "La mini TV que *canta*, escribe y enamora."
  subtitulo: "Ponle canciones, mensajes, fotos y GIF desde tu celular. Un regalo que suena, brilla y saca sonrisas."
  botonPrincipal: "Pedir por WhatsApp"
  botonSecundario: "Ver versiones"
  botonSonido: "Escucha cómo suena"
  # Datos cortos que salen en una línea debajo del subtítulo.
  destacados:
    - "+50 canciones incluidas"
    - "Se maneja desde el celular"
    - "Alarmas con tu canción"

# Sección "Mira lo que puede mostrar". Puedes cambiar textos y el orden,
# pero no el "id" (es el que decide qué animación sale en la pantallita).
muestra:
  titulo: "Mira lo que puede mostrar"
  subtitulo: "Toca cada opción y mira la pantallita en acción."
  tipos:
    - id: "mensajes"
      nombre: "Mensajes"
      titulo: "Dile algo bonito, cuando quieras"
      texto: "Lo escribes en la app y aparece en su TV. Ideal para un buenos días, un te quiero o un recordatorio."
      puntos:
        - "Varias letras y tamaños"
        - "Texto que se desplaza"
        - "Colores invertidos"
    - id: "canciones"
      nombre: "Canciones"
      titulo: "Canciones que suenan y se ven"
      texto: "Trae más de 50 canciones listas. Pueden sonar con letra e imágenes que cambian al ritmo de la música."
      puntos:
        - "+50 canciones incluidas"
        - "Letra e imágenes al ritmo"
        - "Úsalas también como alarma"
    - id: "fotos"
      nombre: "Fotos"
      titulo: "Tus fotos, en versión retro"
      texto: "Elige una foto del celular y la app la convierte en píxeles. También hay una galería con decenas de imágenes listas."
      puntos:
        - "Fotos del celular"
        - "Galería lista para usar"
        - "Ajustas el encuadre y el pixelado"
    - id: "dibujos"
      nombre: "Dibujos"
      titulo: "Dibújale algo con el dedo"
      texto: "Haz un dibujo a mano alzada en la app y mándaselo. Nadie más le va a dar un regalo así."
      puntos:
        - "Dibujo a mano alzada"
        - "Deshacer y volver a intentar"
        - "Guárdalos en tu galería"
    - id: "gif"
      nombre: "GIF"
      titulo: "GIF y animaciones"
      texto: "Que su TV se mueva: sube tus propios GIF o elige animaciones de la galería. Se repiten solas."
      puntos:
        - "Tus propios GIF"
        - "Animaciones listas"
        - "Se repiten en bucle"
    - id: "reloj"
      nombre: "Reloj"
      titulo: "Reloj y alarmas con tu canción"
      texto: "Muestra la hora y la fecha, y tiene hasta 3 alarmas que suenan solas con la canción que elijas."
      puntos:
        - "Hasta 3 alarmas"
        - "Suenan con la canción que quieras"
        - "Brillo y volumen a tu gusto"

# Sección "Funciones". En cada una, version dice si es solo de una versión:
# "wifi" (TV RETRO), "lite" (TV RETRO Lite) o "" (las dos).
# icono: compartir, juegos, galeria, actualizar, ajustes, bluetooth.
funciones:
  titulo: "Hecha para usarla todos los días"
  subtitulo: "Lo que la hace distinta a cualquier otro regalo."
  destacada:
    titulo: "Mándale algo aunque estés lejos"
    texto: "Lo que envías desde la app llega a su pantalla esté donde esté: en otra casa o en otra ciudad."
    version: "wifi"
    # Mensaje de la animación (cortito).
    mensaje: "¡Te extraño!"
  lista:
    - icono: "compartir"
      titulo: "Compártela con tu gente"
      texto: "Hasta 5 personas pueden enviarle cosas a la misma TV: tu familia, tu pareja o tus amigos."
      version: "wifi"
    - icono: "juegos"
      titulo: "Juega con la rueda"
      texto: "Trae 5 juegos que se manejan con el botón y la rueda de la TV."
      version: "wifi"
    - icono: "galeria"
      titulo: "Galería lista para usar"
      texto: "Decenas de imágenes y animaciones para enviar con un toque."
      version: ""
    - icono: "actualizar"
      titulo: "Siempre al día"
      texto: "Se actualiza sola por Wi-Fi y recibe mejoras nuevas."
      version: "wifi"
    - icono: "ajustes"
      titulo: "A tu gusto"
      texto: "Ajusta el brillo, el volumen y la zona horaria desde la app."
      version: "wifi"
    - icono: "bluetooth"
      titulo: "Sin internet"
      texto: "Se conecta directo a tu celular por Bluetooth: no necesita Wi-Fi."
      version: "lite"

# Sección "Cómo funciona" (3 pasos). Las pantallitas son las que muestra la TV real.
pasos:
  titulo: "Cómo funciona"
  subtitulo: "Tres pasos, y solo la primera vez."
  lista:
    - titulo: "Conéctala a tu Wi-Fi"
      texto: "Enchúfala y su pantalla te muestra un código QR. Escanéalo con tu celular y escoge tu red."
    - titulo: "Vincúlala a tu cuenta"
      texto: "Abre la app TV RETRO y escribe el código que aparece en la TV. Así queda a tu nombre."
    - titulo: "Envíale lo que quieras"
      texto: "Escribe un mensaje, elige una canción o una foto, y toca Enviar a la TV."
  # Frase para la versión Lite (déjala vacía "" para ocultarla).
  notaLite: "¿Tienes la Lite? Es aún más fácil: se empareja con tu celular por Bluetooth desde la misma app."

# Videos de TikTok (se cargan solo cuando alguien les da play).
# Pega el enlace COMPLETO del video, el que sale al abrirlo en el navegador:
#   https://www.tiktok.com/@usuario/video/1234567890123456789
# Si quieres menos videos, borra el bloque completo (desde el guion).
videos:
  titulo: "Así suenan en TikTok"
  subtitulo: "Las mismas canciones que suenan en la TV. Dale play."
  lista:
    - enlace: "[PENDIENTE: enlace del video 1]"
      titulo: "[PENDIENTE: nombre de la canción 1]"
    - enlace: "[PENDIENTE: enlace del video 2]"
      titulo: "[PENDIENTE: nombre de la canción 2]"
    - enlace: "[PENDIENTE: enlace del video 3]"
      titulo: "[PENDIENTE: nombre de la canción 3]"
    - enlace: "[PENDIENTE: enlace del video 4]"
      titulo: "[PENDIENTE: nombre de la canción 4]"

# Las dos versiones. estado: "disponible" o "proximamente".
versiones:
  - id: "wifi"
    nombre: "TV RETRO"
    estado: "disponible"
    precio: "[PENDIENTE: precio de la TV RETRO]"
    mensajeWhatsApp: "¡Hola! Quiero la TV RETRO (versión Wi-Fi) 📺"
  - id: "lite"
    nombre: "TV RETRO Lite"
    estado: "proximamente"
    precio: "[PENDIENTE: precio de la TV RETRO Lite]"
    mensajeWhatsApp: "¡Hola! Me interesa la TV RETRO Lite 📺"

# Páginas legales (ya existen en la app).
legal:
  privacidad: "https://cartica07.github.io/TV_RETRO/privacidad.html"
  terminos: "https://cartica07.github.io/TV_RETRO/terminos.html"
